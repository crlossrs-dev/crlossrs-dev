<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 614" width="100%" height="100%">
  <style>
    .terminal-bg {
      fill: #0d1117;
      rx: 8px;
    }
    .ascii-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      fill: #58a6ff;
      white-space: pre;
    }
    .line {
      opacity: 0;
      animation: fadeIn 0.1s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" class="terminal-bg" />
  
  <g transform="translate(20, 30)">
    <text class="ascii-text">
      <tspan x="0" dy="14" class="line" style="animation-delay: 0.0s;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@</tspan>
