      <tspan x="0" dy="14" class="line" style="animation-delay: 1.2s;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@=@@@+==+========@@@@==@@=+++==++===========+@</tspan>
    </text>
  </g>
</svg>
