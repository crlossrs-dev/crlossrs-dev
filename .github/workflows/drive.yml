name: Contribution drive

on:
  schedule:
    - cron: "17 4 * * *"   # cada día a las 04:17 UTC
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar SVG
        run: node scripts/drive.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/drive.svg
          git diff --cached --quiet || git commit -m "chore: actualizar drive.svg"
          git push
